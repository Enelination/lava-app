services:
  - type: web
    name: lava-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard (or paste values below).
      # CLAUDE_API_KEY is required for the AI assistant.
      - key: CLAUDE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
